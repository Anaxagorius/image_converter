[package]
name = "image-converter"
version = "0.1.0"
edition = "2021"
description = "Simple batch image format converter with drag-and-drop (Rust + egui)"
authors = ["T B"]

[dependencies]
eframe = "0.35"
egui = "0.35"
image = { version = "0.25", default-features = true }  # PNG, JPEG, WebP, GIF, BMP, TIFF, etc.
rfd = "0.17"
rayon = "1.10"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
